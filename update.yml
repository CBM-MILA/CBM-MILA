name: تحديث بيانات شباب ميلة (CBM Mila Scraper)

on:
  schedule:
    - cron: '*/30 * * * *'   # يعمل تلقائياً كل 30 دقيقة
  workflow_dispatch:         # يسمح بالتشغيل اليدوي من تبويب Actions

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: سحب ملفات المستودع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: تثبيت المكتبات المطلوبة
        run: pip install requests beautifulsoup4

      - name: تشغيل مراقب البيانات (scraper.py)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        run: python scraper.py

      - name: حفظ ورفع التحديثات إن وُجدت
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "لا توجد تغييرات جديدة في data/data.json"
          else
            git commit -m "chore(data): تحديث تلقائي لبيانات شباب ميلة [skip ci]"
            git push
          fi
