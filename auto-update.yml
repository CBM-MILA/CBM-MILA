name: Auto Update CBM Mila Data

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python scraper.py

      - name: Commit and publish if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "cbm-bot"
          git config user.email "cbm-bot@users.noreply.github.com"
          git add data/data.json
          if [ -f data.json ]; then
            cp data/data.json data.json
            git add data.json
          fi
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "auto-update data [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase && git push; then
                echo "Pushed successfully on attempt $attempt"
                break
              fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 3
            done
          fi
