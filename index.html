const regUrl=()=>{const u=String(window.CBM_REG_URL||'').trim();return /^https:\/\/script\.google\.com\/.+\/exec$/.test(u)?u:REG_FALLBACK};
const REG_SET=()=>/^https:\/\/script\.google\.com\/.+/.test(regUrl());

async function regCall(o){
  const U=regUrl();if(!REG_ON())throw Object.assign(new Error('REGISTRY_NOT_CONFIGURED'),{code:'REGISTRY_NOT_CONFIGURED'});
  const body=JSON.stringify(o),c=new AbortController(),to=setTimeout(()=>c.abort(),15000);
  try{
    const r=await fetch(U,{method:'POST',mode:'cors',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:c.signal});
    const tx=await r.text();let j;try{j=JSON.parse(tx)}catch(e){throw Object.assign(new Error('INVALID_RESPONSE'),{code:'INVALID_RESPONSE',status:r.status})}
    if(!r.ok||!j||typeof j!=='object')throw Object.assign(new Error('SERVER_ERROR'),{code:'SERVER_ERROR',status:r.status});
    return j;
  }catch(e){if(e.name==='AbortError')throw Object.assign(new Error('TIMEOUT'),{code:'TIMEOUT'});throw e}
  finally{clearTimeout(to)}
}
const CK='CBM_MILA_CARD_V2';
const normalizeCard=c=>{
  if(!c||typeof c!=='object')return null;
  const supporterId=String(c.supporterId||c.no||'').toUpperCase().replace(/\s+/g,'');
  const name=String(c.name||'').replace(/\s+/g,' ').trim().slice(0,80);
  if(!name||!/^CBM-\d{6}$/.test(supporterId))return null;
  return {supporterId,name,serialNumber:String(c.serialNumber||supporterId).toUpperCase(),status:['active','inactive','revoked'].includes(c.status)?c.status:'active',createdAt:c.createdAt||c.d||new Date().toISOString(),qrDataUrl:c.qrDataUrl||''};
};

let q=txt;if(c.measureText(q).width>mw){while(q.length>1&&c.measureText(q+'…').width>mw)q=q.slice(0,-1);q+='…'}
c.direction=/[\u0600-\u06FF]/.test(txt)?'rtl':'ltr';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.shadowColor='rgba(0,0,0,.7)';c.shadowBlur=5;c.fillText(q,x,y+2);c.shadowBlur=0}

function cardBox(){const c=getCard();return c?`<div class="glass" style="padding:14px;margin-bottom:14px"><div style="font-weight:900">🔴⚪ ${t('cmy')}</div><small style="color:var(--mu);font-weight:700">${esc(c.name)} · ${esc(c.supporterId)} · ${esc(c.status.toUpperCase())}</small><div class="btns"><button class="btn p" data-cview>${t('cview')}</button></div></div>`:`<button class="ccta" data-cnew><span style="font-size:30px">🎫</span><span>${t('ccta')}<small>${t('cphd2')}</small></span></button>`}
function cardForm(){cmOpen(`<h3>${t('ccta')}</h3><small style="color:var(--mu);font-weight:700">${t('cphd')}</small><input id="cin" dir="auto" maxlength="80" autocomplete="name" placeholder="${t('cname')}"><p class="cerr" id="cerr"></p><small style="display:block;margin-top:8px;color:var(--mu)">${t('cpriv')}</small><div class="btns"><button class="btn p" id="c-go">${t('cgo')}</button><button class="btn" data-cclose>✕</button></div>${REG_ON()?`<div class="btns" style="margin-top:8px"><button class="btn" data-crest style="font-size:12px">${t('crest')}</button></div>`:''}`);setTimeout(()=>{$('cin')?.focus()},60)}
function cardRestore(){cmOpen(`<h3>${t('crest')}</h3><small style="color:var(--mu);font-weight:700">${t('crsh')}</small><input id="cin-rg" dir="auto" maxlength="80" placeholder="${t('cname')}"><input id="cno" dir="ltr" inputmode="text" maxlength="10" placeholder="CBM-000024"><p class="cerr" id="cerr-rg"></p><div class="btns"><button class="btn p" id="c-rg">${t('crsg')}</button><button class="btn" data-cclose>✕</button></div>`);setTimeout(()=>{$('cin-rg')?.focus()},60)}
function cardSave(k){const c=normalizeCard(k);if(!c)throw new Error('INVALID_CARD');try{localStorage.setItem(CK,JSON.stringify(c))}catch(e){}render();cardShow(c)}
async function cardIssue(){const i=$('cin'),v=i?.value.replace(/\s+/g,' ').trim()||'',er=$('cerr'),go=$('c-go');if(!i||!er||!go)return;er.textContent='';i.classList.remove('er');if(v.length<2||v.length>80){i.classList.add('er');er.textContent=t('cnameerr');i.focus();return}if(!REG_ON()){er.textContent=t('cnet')+' [REGISTRY_NOT_CONFIGURED]';return}go.disabled=true;go.setAttribute('aria-busy','true');go.textContent=t('cload');const requestId=crypto.randomUUID?crypto.randomUUID():devId()+'-'+Date.now();try{let r=await regCall({v:2,a:'register',name:v,requestId,dev:devId(),lang:S.lang});if(isBad(r))r=legacyRes(await regCall({v:1,a:'register',name:v,dev:devId(),lang:S.lang}));if(r&&r.ok)return cardSave({supporterId:r.supporterId,serialNumber:r.serialNumber,name:r.name||v,status:r.status||'active',createdAt:r.createdAt});er.textContent=r&&r.code==='exists'?t('cdup'):cerr(r||{code:'INVALID_RESPONSE'})}catch(e){er.textContent=cerr(e)}go.disabled=false;go.removeAttribute('aria-busy');go.textContent=t('cgo')}
async function cardRestoreGo(){const v=($('cin-rg')||$('cin'))?.value.replace(/\s+/g,' ').trim()||'',id=$('cno')?.value.trim().toUpperCase()||'',er=$('cerr-rg')||$('cerr'),go=$('c-rg');if(!er||!go)return;er.textContent='';if(!/^CBM-\d{6}$/.test(id)||v.length<2){er.textContent=t('crsf');return}go.disabled=true;go.setAttribute('aria-busy','true');go.textContent=t('cload');try{let r=await regCall({v:2,a:'restore',name:v,supporterId:id});if(isBad(r)){const n=parseInt(id.replace(/\D/g,''),10)||0;r=legacyRes(await regCall({v:1,a:'restore',name:v,no:String(n).padStart(4,'0')}));if(r&&r.ok===false)r=legacyRes(await regCall({v:1,a:'restore',name:v,no:String(n)}))}if(r&&r.ok)return cardSave({supporterId:r.supporterId,serialNumber:r.serialNumber,name:r.name,status:r.status,createdAt:r.createdAt});er.textContent=t(r?.code==='revoked'?'crevoked':'crsf')}catch(e){er.textContent=cerr(e)}go.disabled=false;go.removeAttribute('aria-busy');go.textContent=t('crsg')}
/* توافق مع سكربت Google القديم (بروتوكول v1): إن ردّ السكربت بـ bad نعيد المحاولة بصيغة v1 */
const legacyRes=o=>{if(o&&o.ok&&o.no)return{ok:true,supporterId:'CBM-'+String(o.no).replace(/\D/g,'').padStart(6,'0'),serialNumber:'CBM-'+String(o.no).replace(/\D/g,'').padStart(6,'0'),name:o.name,status:'active',createdAt:o.d||new Date().toISOString()};return o};
const isBad=r=>r&&r.ok===false&&(r.code==='bad'||r.code==='unsupported'||r.code==='version');
let cUrl='';
async function cardShow(k){if(!k)return;cmOpen('<div class="empty" role="status">…</div>');try{const cv=await drawCard(k),b=await new Promise(r=>cv.toBlob(r,'image/png'));if(!b)throw new Error('PNG_EXPORT_FAILED');if(cUrl)URL.revokeObjectURL(cUrl);cUrl=URL.createObjectURL(b);const box=$('cmb');box.replaceChildren();const h=document.createElement('h3');h.textContent=t('cmy')+' · '+k.supporterId;const img=document.createElement('img');img.src=cUrl;img.alt=t('cmy');img.decoding='async';const btns=document.createElement('div');btns.className='btns v';const dl=document.createElement('button');dl.className='btn p';dl.id='c-dl';dl.textContent='⬇️ '+t('cdl');const sh=document.createElement('button');sh.className='btn';sh.id='c-share';sh.textContent='↗️ '+t('cshare');const close=document.createElement('button');close.className='btn';close.dataset.cclose='';close.textContent='✕';btns.append(dl,sh,close);const p=document.createElement('p');p.style.cssText='margin:10px 0 0;color:var(--mu);font-size:11.5px;font-weight:600;text-align:center';p.textContent=t('csave');box.append(h,img,btns,p);$('cm').classList.add('open')}catch(e){console.error('[CBM card]',e);cmOpen('<div class="empty">'+esc(t('cqrerr'))+'</div><div class="btns"><button class="btn" data-cclose>✕</button></div>')}}
async function cardShare(){if(!cUrl)return;try{const k=getCard(),res={title:'CBM Mila Supporter Card',text:k?`${k.name} · ${k.supporterId}`:'CBM Mila',url:k?verificationUrl(k.supporterId):location.origin};if(navigator.share){const blob=await fetch(cUrl).then(r=>r.blob()),file=new File([blob],'CBM-Mila-Supporter.png',{type:'image/png'});if(!navigator.canShare||navigator.canShare({files:[file]}))return navigator.share({...res,files:[file]});return navigator.share(res)}if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(res.url);toast(t('csharefallback'))}catch(e){toast(t('csharefallback'))}}
function cardDl(){const k=getCard();if(!cUrl||!k)return;const a=document.createElement('a');a.href=cUrl;a.download='CBM-Mila-Supporter-'+k.supporterId+'.png';document.body.appendChild(a);a.click();a.remove()}
/* persistence, sync (embedded -> cache -> network) */
function save(){try{localStorage.setItem(KEY,JSON.stringify({lang:S.lang,theme:S.theme,data:S.data}))}catch(e){}}
const valid=d=>d&&typeof d==='object'&&String(d.club?.id)===CBM&&Array.isArray(d.matches)&&Array.isArray(d.players)&&Array.isArray(d.standings);
const nofr=v=>Array.isArray(v)?v.map(nofr):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).filter(([k])=>k!=='fr').map(([k,x])=>[k,nofr(x)])):v;
function load(){try{const p=JSON.parse(localStorage.getItem(KEY)||'{}');if(p.lang==='en'||p.lang==='ar')S.lang=p.lang;if(p.theme)S.theme=p.theme;
if(valid(p.data)&&Date.parse(p.data.lastUpdated)>Date.parse(D0.lastUpdated))S.data=nofr(p.data)}catch(e){}}
let syncBusy=0,syncAt=0;
async function sync(force){if(!NET||syncBusy)return;if(!force&&Date.now()-syncAt<15e3)return;syncBusy=1;syncAt=Date.now();
try{const c=new AbortController(),to=setTimeout(()=>c.abort(),12e3),r=await fetch('./data/data.json?ts='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(to);if(!r.ok)throw 0;const d=nofr(await r.json());if(!valid(d))throw 0;
if(Date.parse(d.lastUpdated)>Date.parse(S.data.lastUpdated)){S.data=d;save();const h=document.documentElement;h.classList.add('nq');requestAnimationFrame(()=>{render();shell();requestAnimationFrame(()=>setTimeout(()=>h.classList.remove('nq'),60))})}}catch(e){}finally{syncBusy=0}}
let dip=null;const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),isSA=(matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true,IBK='CBM_IB_V1';
const ibOff=()=>{try{return Date.now()-(+localStorage.getItem(IBK)||0)<6048e5}catch(e){return false}};
function ibShow(){const b=$('ib');if(!b||isSA||ibOff())return;b.querySelector('span').textContent=t(dip?'ibmsg':'ibios');const g=$('ib-go');g.textContent=t('ibgo');g.style.display=dip?'':'none';b.classList.add('on')}
const ibHide=()=>{const b=$('ib');b&&b.classList.remove('on')};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;S.inst=1;const b=$('b-inst');if(b)b.style.display='block';ibShow()});
addEventListener('appinstalled',()=>{dip=null;S.inst=0;ibHide();const b=$('b-inst');if(b)b.style.display='none'});
async function install(){if(!dip){if(isIOS)toast(t('ibios'));return}ibHide();const p=dip;dip=null;try{p.prompt();await p.userChoice}catch(e){}S.inst=0;const b=$('b-inst');if(b)b.style.display='none'}
async function pwa(){if(!NET||!('serviceWorker' in navigator))return;try{await navigator.serviceWorker.register('./sw.js')}catch(e){}}
const NET=/^https?:$/.test(location.protocol)&&(!/^(localhost|127\.|0\.0\.0\.0|\[::1\]|.*\.local$)/.test(location.hostname)||/[?&]live=1/.test(location.search));
S.data=nofr(D0);load();try{const old=JSON.parse(localStorage.getItem('CBM_MILA_CARD_V1')||'null');if(old&&!getCard()&&/^CBM-\d{6}$/.test(String(old.no||'')))localStorage.setItem(CK,JSON.stringify(normalizeCard({supporterId:old.no,name:old.name,status:'active',createdAt:old.d})))}catch(e){}shell();render();pwa();sync(false);if(isIOS)setTimeout(ibShow,3e3);setInterval(()=>{if(!document.hidden)sync(false)},3e5);
addEventListener('online',()=>sync(false));addEventListener('focus',()=>sync(false));

/* tactile tilt & spotlight */
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;let f=0,E;const sel='.pass,.t,.tc,.mi,.hero',rst=()=>document.querySelectorAll('[style*="--rx"]').forEach(n=>{n.style.removeProperty('--rx');n.style.removeProperty('--ry')});
addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest(sel);if(!c){if(E){E=null;rst()}return}E={e,c};if(f)return;f=requestAnimationFrame(()=>{f=0;if(!E)return;const{e,c}=E,r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',(x*100).toFixed(1)+'%');c.style.setProperty('--my',(y*100).toFixed(1)+'%');c.style.setProperty('--rx',((.5-y)*5).toFixed(2)+'deg');c.style.setProperty('--ry',((x-.5)*7).toFixed(2)+'deg')})},{passive:true});
['pointerup','pointercancel','pointerleave'].forEach(k=>addEventListener(k,()=>{E=null;rst()},{passive:true}))})();

(()=>{let y=scrollY;addEventListener('scroll',()=>{const d=scrollY-y;if(Math.abs(d)<10)return;$('nav').classList.toggle('hd',d>0&&scrollY>140);y=scrollY},{passive:true})})();
