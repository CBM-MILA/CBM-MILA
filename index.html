<style>
:root {
  --bg: #040407;
  --bg2: #0c0c12;
  --card: rgba(255,255,255,.045);
  --card2: rgba(255,255,255,.08);
  --line: rgba(255,255,255,.1);
  --tx: #ffffff;
  --mu: rgba(255,255,255,.58);
  --red: #FF0F23;
  --red2: #B0000F;
  --gold: #FFB020;
  --glow: rgba(255,15,35,.38);
  --w: #22c55e;
  --d: #f5b301;
  --l: #FF0F23;
  --nav: rgba(10,10,15,.78);
  --f: 'Cairo', system-ui, -apple-system, sans-serif;
  --mono: 'Inter', ui-monospace, SFMono-Regular, Menlo, monospace;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --spr: cubic-bezier(.34,1.56,.64,1);
  --out: cubic-bezier(.16,1,.3,1);
  --glass: linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.025) 55%, rgba(255,15,35,.06));
  --edge: inset 1px 1px 0 rgba(255,255,255,.26), inset -1px -1px 0 rgba(255,15,35,.32), inset 0 0 0 1px rgba(255,255,255,.05);
}
[data-theme=light] {
  --bg: #eef0f6;
  --bg2: #ffffff;
  --card: rgba(255,255,255,.85);
  --card2: rgba(0,0,0,.05);
  --line: rgba(0,0,0,.09);
  --tx: #0d0d12;
  --mu: rgba(0,0,0,.56);
  --glow: rgba(227,6,19,.18);
  --nav: rgba(255,255,255,.85);
  --glass: linear-gradient(145deg, rgba(255,255,255,.96), rgba(255,255,255,.72));
  --edge: inset 1px 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(0,0,0,.08);
}
html[lang=en] { --f: 'Inter', system-ui, -apple-system, sans-serif; }
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--f);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
body {
  min-height: 100vh;
  user-select: none;
  -webkit-user-select: none;
  padding-bottom: calc(116px + var(--sb));
  background:
    radial-gradient(80% 36% at 85% -8%, rgba(255,15,35,.3), transparent 70%),
    radial-gradient(60% 30% at 0 100%, rgba(255,176,32,.08), transparent 70%),
    radial-gradient(70% 40% at 50% 120%, rgba(255,15,35,.09), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
[data-theme=light] body {
  background: radial-gradient(70% 30% at 85% -6%, rgba(255,15,35,.12), transparent 70%), var(--bg);
}
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* Animations */
@keyframes rise { from { opacity: 0; transform: translate3d(0,18px,0) scale(.97); } }
@keyframes fillbar { from { transform: scaleX(0); } }
@keyframes shine { 60%, 100% { transform: translateX(120%); } }
@keyframes cine { from { opacity: 0; transform: translate3d(0,14%,0) scale(.95); } }
@keyframes pls { 50% { opacity: .55; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes smk { from { transform: translate3d(-3%,2%,0) scale(1); } to { transform: translate3d(3%,-2%,0) scale(1.08); } }
@keyframes cpl { 0% { box-shadow: 0 0 0 0 rgba(255,15,35,.6); } 75%, 100% { box-shadow: 0 0 0 14px rgba(255,15,35,0); } }

/* Header */
header {
  position: sticky;
  top: 0;
  z-index: 35;
  padding: calc(10px + var(--st)) 14px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(4,4,7,.72);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
  backdrop-filter: blur(20px) saturate(1.6);
}
[data-theme=light] header { background: rgba(238,240,246,.82); }
header:after {
  content: "";
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--red), var(--gold), transparent);
  opacity: .75;
}
header img {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  object-fit: contain;
  background: #fff;
  padding: 2px;
  box-shadow: 0 0 0 1.5px var(--red), 0 0 18px rgba(255,15,35,.6);
}
.brand { flex: 1; line-height: 1.15; min-width: 0; }
.brand b { font-size: 16.5px; font-weight: 900; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand b:after { content: " // 1936"; font: 800 10px var(--mono); letter-spacing: .15em; color: var(--gold); }
.brand small { font: 700 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mu); display: block; }

.pill {
  height: 36px;
  min-width: 42px;
  padding: 0 11px;
  border-radius: 99px;
  background: var(--glass);
  box-shadow: var(--edge);
  font-weight: 800;
  font-size: 12.5px;
  display: inline-grid;
  place-items: center;
  transition: transform .3s var(--spr);
}
.pill.ic { width: 36px; min-width: 36px; padding: 0; font-size: 15px; }
.pill:active, .btn:active, .fxi:active, .chips button:active { transform: scale(.91); }
.spinning { animation: spin .8s linear infinite; }

/* Main Container */
main {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 14px 14px 20px;
  overflow-x: clip;
}
main > *, .bn > *, .tg > * { animation: rise .55s var(--out) backwards; }
.bn > :nth-child(2), .tg > :nth-child(2) { animation-delay: .04s; }
.bn > :nth-child(3), .tg > :nth-child(3) { animation-delay: .08s; }
.bn > :nth-child(4), .tg > :nth-child(4) { animation-delay: .12s; }
.bn > :nth-child(n+5), .tg > :nth-child(n+5) { animation-delay: .16s; }

/* Section Headers */
.h2 {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  margin: 20px 4px 10px;
  font: 800 12px var(--f);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--gold);
}
.h2:before { content: "▸"; margin-inline-end: 7px; color: var(--red); }
.h2:after { content: ""; flex: 1; height: 1px; margin-inline-start: 10px; background: linear-gradient(90deg, rgba(255,15,35,.55), transparent); }
.h2 small { margin-inline-start: 10px; order: 3; font-size: 11.5px; color: var(--red); font-weight: 800; }

/* Cards & Surfaces */
.t, .mi, .tc, .glass, .hero {
  --s: 1;
  position: relative;
  border-radius: 24px;
  background: var(--glass), rgba(10,10,15,.78);
  box-shadow: var(--edge), 0 18px 38px -22px rgba(255,15,35,.45);
  transform: perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--s));
  transition: transform .45s var(--spr);
}
[data-theme=light] .t, [data-theme=light] .mi, [data-theme=light] .tc, [data-theme=light] .glass, [data-theme=light] .hero {
  background: var(--glass), #ffffff;
  box-shadow: var(--edge), 0 12px 28px -16px rgba(0,0,0,.1);
}
.t:active, .mi:active, .tc:active { --s: .96; }

/* Hero & Recap */
.hero { padding: 20px 16px 16px; overflow: hidden; color: var(--tx); }
.hero > i.wm {
  position: absolute;
  inset-inline: 0;
  bottom: -24px;
  z-index: 0;
  text-align: center;
  font: 900 108px/1 var(--mono);
  letter-spacing: -.05em;
  color: transparent;
  -webkit-text-stroke: 1.2px rgba(255,176,32,.18);
  pointer-events: none;
  font-style: normal;
  direction: ltr;
}
.hero > *:not(.wm) { position: relative; z-index: 1; }
.lab { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--mu); }
.vs { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 8px; text-align: center; margin: 14px 0; }
.tm { display: flex; flex-direction: column; align-items: center; gap: 7px; font-weight: 800; font-size: 13px; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
.crest { border-radius: 50%; object-fit: contain; background: #fff; display: grid; place-items: center; color: #000; font-weight: 900; flex: none; overflow: hidden; box-shadow: 0 0 0 2px rgba(255,15,35,.32); }
.crest.cbm { background: #fff var(--logo) center/82% no-repeat; }
.mid { font: 900 38px/1 var(--mono); letter-spacing: -.04em; }
.mid small { display: block; font: 700 11px var(--f); color: var(--mu); margin-top: 4px; letter-spacing: 0; }

/* Next Match Pass Card */
.bn { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.pw, .sf { grid-column: 1 / -1; }
.s2 { grid-column: span 2; }
@media (min-width: 620px) { .bn { grid-template-columns: repeat(4, minmax(0,1fr)); } }

.pw { border-radius: 30px; box-shadow: 0 26px 60px -24px rgba(255,15,35,.8), 0 0 0 1px rgba(255,15,35,.35); }
.pass { border-radius: 30px; padding: 0; }
.pi {
  position: relative;
  overflow: hidden;
  border-radius: 30px;
  padding: 0 15px 16px;
  color: #fff;
  background:
    radial-gradient(120% 60% at 50% 0, rgba(255,15,35,.24), transparent 65%),
    linear-gradient(180deg, rgba(5,5,8,.74) 0%, rgba(5,5,8,.91) 100%),
    url('./card-template.jpg') center/cover no-repeat,
    #050508;
  box-shadow: var(--edge);
}
.pi > * { position: relative; z-index: 2; }
.pi > .cn { position: absolute; width: 16px; height: 16px; border: 2px solid var(--red); filter: drop-shadow(0 0 6px var(--red)); pointer-events: none; }
.cn.a { top: 10px; left: 10px; border-right: 0; border-bottom: 0; border-radius: 7px 0 0 0; }
.cn.b { top: 10px; right: 10px; border-left: 0; border-bottom: 0; border-radius: 0 7px 0 0; }
.cn.c { bottom: 10px; left: 10px; border-right: 0; border-top: 0; border-radius: 0 0 0 7px; }
.cn.d { bottom: 10px; right: 10px; border-left: 0; border-top: 0; border-radius: 0 0 7px 0; }

.pbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 -15px 12px;
  padding: 11px 26px 9px;
  font: 800 11px var(--f);
  letter-spacing: .06em;
  text-transform: uppercase;
  background: linear-gradient(90deg, rgba(255,15,35,.55), transparent);
}
.pbar b:before { content: "●"; margin-inline-end: 6px; color: var(--red); animation: pls 1.4s infinite; }
.pbar em { margin-inline-start: auto; font-style: normal; opacity: .8; font-size: 10.5px; }

.pvs { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 6px; text-align: center; }
.pt { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; cursor: pointer; }
.pt b { font-size: 13.5px; font-weight: 900; line-height: 1.2; overflow-wrap: anywhere; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
.pt code { font: 800 10.5px var(--mono); letter-spacing: .2em; padding: 2px 9px; border-radius: 99px; color: var(--gold); border: 1px solid rgba(255,176,32,.48); background: rgba(0,0,0,.45); }
.pass .crest { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--red), 0 0 34px rgba(255,15,35,.85); }
.pm { font: 900 44px/1 var(--mono); letter-spacing: -.05em; text-shadow: -2px 0 rgba(255,15,35,.85), 2px 0 rgba(255,176,32,.6), 0 0 22px rgba(255,15,35,.8); }
.pm small { display: block; margin-top: 6px; font: 700 11px var(--f); letter-spacing: 0; text-shadow: none; color: rgba(255,255,255,.78); }

/* Comparison Meters */
.mtr { display: grid; grid-template-columns: 1fr 44px 1fr; gap: 8px; align-items: center; margin: 7px 0; }
.mtr span { text-align: center; font: 800 9.5px var(--mono); letter-spacing: .08em; color: var(--gold); }
.mtr > div { height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
.mtr i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--red), var(--gold)); box-shadow: 0 0 10px var(--red); animation: fillbar .9s var(--out) backwards; }
.mtr > div:first-child i { transform-origin: 0 50%; }
.mtr > div:last-child i { transform-origin: 100% 50%; }
[dir=rtl] .mtr > div:first-child i { transform-origin: 100% 50%; }
[dir=rtl] .mtr > div:last-child i { transform-origin: 0 50%; }

/* Countdown */
.cd { display: flex; justify-content: center; gap: 8px; margin: 14px 0 12px; direction: ltr; }
.cd div { min-width: 62px; padding: 9px 0 8px; border-radius: 15px; background: rgba(0,0,0,.62); box-shadow: var(--edge); text-align: center; }
.cd b { display: block; font: 900 28px/1 var(--mono); color: #fff; text-shadow: 0 0 14px rgba(255,15,35,.9); }
.cd i { font: 700 8.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-style: normal; }
.cd u { display: block; height: 3px; margin: 7px 10px 0; border-radius: 3px; background: linear-gradient(90deg, var(--red), var(--gold)); transform-origin: 0 50%; transition: transform 1s linear; }

.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; align-items: center; font-size: 12px; color: var(--mu); font-weight: 700; }
.pass .meta { padding: 8px 12px; border-radius: 14px; background: rgba(0,0,0,.52); box-shadow: var(--edge); color: #fff; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 800; }
.tag.h { background: rgba(255,15,35,.2); color: #ff6b78; border: 1px solid rgba(255,15,35,.45); }
.tag.a { background: rgba(255,255,255,.08); color: var(--mu); border: 1px solid var(--line); }
.pass .tag.a { color: #e2e8f0; }

/* Fan Prediction Poll inside Pass */
.poll { margin-top: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(0,0,0,.55); box-shadow: var(--edge); }
.poll-hd { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; font-weight: 800; color: var(--gold); margin-bottom: 8px; }
.poll-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.poll-btn {
  padding: 8px 6px;
  border-radius: 11px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  color: #fff;
  font-size: 11.5px;
  font-weight: 800;
  text-align: center;
  transition: all .2s;
}
.poll-btn.on { background: linear-gradient(135deg, var(--red), var(--red2)); border-color: var(--gold); box-shadow: 0 0 14px rgba(255,15,35,.5); }
.poll-btn small { display: block; font: 700 10px var(--mono); opacity: .85; margin-top: 2px; }

/* Matchday Live Effects */
.mdb { display: inline-block; margin-bottom: 8px; padding: 4px 14px; border-radius: 99px; background: var(--red); color: #fff; font-weight: 900; font-size: 12.5px; animation: pls 1.8s infinite; }
.mdb.W { background: var(--w); animation: none; }
.mdb.D { background: var(--d); color: #111; animation: none; }
.mdb.L { background: var(--l); animation: none; }
.slg {
  display: block; width: max-content; max-width: 100%; margin: 2px auto 12px; padding: 6px 24px;
  font-weight: 900; font-size: clamp(19px, 6vw, 26px); color: #fff;
  background: linear-gradient(100deg, rgba(227,6,19,.2), var(--red) 10%, #b4000d 90%, rgba(227,6,19,.2));
  clip-path: polygon(2% 14%, 98% 0, 100% 86%, 3% 100%);
  transform: rotate(-1.5deg);
}

/* Buttons */
.btns { display: flex; gap: 8px; margin-top: 12px; }
.btn {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 12px; border-radius: 15px; font-weight: 800; font-size: 12.5px; text-align: center;
  background: var(--glass); box-shadow: var(--edge); transition: transform .3s var(--spr);
}
.btn.p {
  position: relative; overflow: hidden; color: #fff;
  background: linear-gradient(180deg, #ff4252, var(--red) 45%, var(--red2));
  box-shadow: var(--edge), 0 10px 26px -8px var(--red);
}
.btn.p:after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.38) 50%, transparent 65%);
  transform: translateX(-120%); animation: shine 4.5s infinite;
}

/* Bento Tiles */
.t { display: flex; flex-direction: column; justify-content: space-between; gap: 8px; min-height: 128px; padding: 14px; overflow: hidden; }
.t.tb { display: block; min-height: 0; }
.tl { font: 800 10.5px var(--f); letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
.sub { font-size: 12px; font-weight: 800; color: var(--mu); }
.big {
  font: 900 64px/.92 var(--mono); letter-spacing: -.06em;
  background: linear-gradient(180deg, #fff 20%, #9ca3af);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 12px rgba(255,15,35,.45));
}
.rk .big { background: linear-gradient(180deg, #ff6b78, var(--red)); -webkit-background-clip: text; background-clip: text; }
[data-theme=light] .big { background: linear-gradient(180deg, #111, #555); -webkit-background-clip: text; background-clip: text; filter: none; }
[data-theme=light] .rk .big { background: linear-gradient(180deg, #e30613, #90000b); -webkit-background-clip: text; background-clip: text; }
.t .ghost {
  position: absolute; inset-inline-end: -4px; bottom: -14px;
  font: 900 94px/1 var(--mono); font-style: normal; color: transparent;
  -webkit-text-stroke: 1.2px rgba(255,176,32,.25); pointer-events: none;
}

/* Form Badges */
.form { display: flex; gap: 6px; flex-wrap: wrap; }
.f {
  width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
  font: 900 13px var(--mono); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 4px 10px -4px currentColor;
}
.f.W { background: linear-gradient(180deg, #22c55e, #15803d); color: #16a34a; }
.f.D { background: linear-gradient(180deg, #f5b301, #b45309); color: #d97706; }
.f.L { background: linear-gradient(180deg, #ef2b36, #b4000d); color: #E30613; }
.f span { color: #fff; }
.f.s { width: 15px; height: 15px; border-radius: 4px; font-size: 9px; }
.mf5 { display: flex; gap: 2px; justify-content: center; flex: none; min-width: 82px; }

/* Upcoming Strip */
.fx { justify-content: flex-start; }
.fxs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.fxs::-webkit-scrollbar { display: none; }
.fxi {
  flex: none; width: 96px; display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 10px 6px; text-align: center; border-radius: 18px; background: var(--glass); box-shadow: var(--edge); cursor: pointer;
}
.fxi b { font-size: 11px; line-height: 1.2; font-weight: 800; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fxi small { font: 700 9.5px var(--f); color: var(--mu); }

/* Match List Item */
.mi {
  display: block; width: 100%; overflow: hidden; padding: 14px 14px 12px 18px;
  margin-bottom: 10px; cursor: pointer;
}
.mi:before {
  content: ""; position: absolute; inset-block: 14px; inset-inline-start: 6px; width: 3.5px;
  border-radius: 4px; background: var(--b, var(--line)); box-shadow: 0 0 10px var(--b, transparent);
}
.mi.w { --b: var(--w); }
.mi.l { --b: var(--red); }
.mi.d { --b: var(--d); }
.mr { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 8px; }
.mr .tm { flex-direction: row; font-size: 13px; cursor: pointer; }
.mr .tm:last-child { flex-direction: row-reverse; }
.mr .tm > span:not(.crest) { flex: 1; text-align: start; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mr .tm:last-child > span:not(.crest) { text-align: end; }
.scr { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.sc {
  font: 900 18px var(--mono); min-width: 68px; height: 34px; padding: 0 12px;
  border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  background: rgba(0,0,0,.55); box-shadow: var(--edge); color: #fff;
}
[data-theme=light] .sc { background: rgba(0,0,0,.07); color: var(--tx); }
.sc.w { color: #4ade80; text-shadow: 0 0 10px rgba(34,197,94,.6); }
.sc.l { color: #ff6b78; text-shadow: 0 0 10px rgba(255,15,35,.6); }
.sc.d { color: #fbbf24; text-shadow: 0 0 10px rgba(245,158,11,.6); }
.sc.u { font-size: 14px; color: var(--mu); text-shadow: none; }
[data-theme=light] .sc.w { color: #15803d; text-shadow: none; }
[data-theme=light] .sc.l { color: #c4000e; text-shadow: none; }
[data-theme=light] .sc.d { color: #b45309; text-shadow: none; }
.mf { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; font-size: 11.5px; color: var(--mu); font-weight: 700; gap: 8px; flex-wrap: wrap; }
.goals-inline { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line); font-size: 11px; color: var(--gold); font-weight: 700; }

/* Controls, Tabs, Search, Summary Strip */
.seg { display: flex; padding: 4px; border-radius: 16px; background: rgba(0,0,0,.45); box-shadow: var(--edge); margin-bottom: 12px; gap: 4px; }
[data-theme=light] .seg { background: rgba(0,0,0,.06); }
.seg button { flex: 1; padding: 9px 6px; border-radius: 12px; font-weight: 800; font-size: 12.5px; color: var(--mu); transition: all .2s; }
.seg button.on { background: linear-gradient(180deg, #ff4252, var(--red2)); color: #fff; box-shadow: 0 4px 16px -4px var(--red); }

.chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; align-items: center; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; padding: 7px 14px; border-radius: 99px; background: var(--glass); box-shadow: var(--edge); font-weight: 800; font-size: 12px; color: var(--mu); }
.chips button.on { background: var(--red); color: #fff; box-shadow: 0 0 18px -4px var(--red); }

.sbar { display: flex; gap: 8px; margin-bottom: 12px; }
.sinp {
  flex: 1; padding: 10px 14px; border-radius: 14px; background: var(--glass); box-shadow: var(--edge);
  color: var(--tx); font-size: 13px; font-weight: 700;
}
.sinp::placeholder { color: var(--mu); }
.ssel {
  padding: 10px 12px; border-radius: 14px; background: var(--glass); box-shadow: var(--edge);
  color: var(--tx); font-size: 12px; font-weight: 800;
}
.ssel option { background: #121218; color: #fff; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-bottom: 12px; }
.kpi { padding: 10px 6px; border-radius: 16px; background: var(--glass); box-shadow: var(--edge); text-align: center; }
.kpi b { display: block; font: 900 18px var(--mono); color: var(--tx); }
.kpi small { font-size: 10.5px; font-weight: 700; color: var(--mu); }

/* Standings Table */
.tbl { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.tbl::-webkit-scrollbar { display: none; }
.tr {
  position: relative; display: grid;
  grid-template-columns: 20px minmax(92px,1fr) 20px 18px 18px 18px 32px 24px 78px 26px;
  align-items: center; gap: 3px; padding: 10px 8px; min-width: 360px;
  font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--line); text-align: center; cursor: pointer;
}
.tr.mini {
  grid-template-columns: 20px minmax(108px,1fr) 24px 28px 82px 32px;
  min-width: 320px;
}
.tr:last-child { border: 0; }
.tr:after {
  content: ""; position: absolute; inset-inline: 10px; bottom: 0; height: 2px;
  background: linear-gradient(90deg, var(--red), var(--gold));
  transform: scaleX(var(--v,0)); transform-origin: 0 50%; opacity: .75;
}
[dir=rtl] .tr:after { transform-origin: 100% 50%; }
.tr.hd { font: 800 10px var(--f); color: var(--gold); padding: 10px; cursor: default; }
.tr.hd:after { display: none; }
.tr > span:first-child { font: 900 13.5px var(--mono); }
.tr:nth-child(-n+4):not(.hd) > span:first-child { color: var(--gold); text-shadow: 0 0 10px rgba(255,176,32,.6); }
.tr .cl { display: flex; align-items: center; gap: 6px; text-align: start; min-width: 0; }
.tr .cl span { white-space: normal; line-height: 1.25; font-size: 12px; font-weight: 800; }
.tr.me {
  background: linear-gradient(90deg, rgba(255,15,35,.28), transparent);
  box-shadow: inset 3px 0 var(--red);
}
[dir=rtl] .tr.me {
  background: linear-gradient(270deg, rgba(255,15,35,.28), transparent);
  box-shadow: inset -3px 0 var(--red);
}
.ded { font-size: 9.5px; color: #ff6b78; display: block; font-weight: 800; }

/* Squad Cards */
.tg { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
@media (min-width: 600px) { .tg { grid-template-columns: repeat(3, minmax(0,1fr)); } }
.tc { --ac: #FF0F23; display: block; aspect-ratio: 3 / 4.55; overflow: hidden; }
.tc[data-p=GK] { --ac: #FFB020; }
.tc[data-p=DEF] { --ac: #60a5fa; }
.tc[data-p=MID] { --ac: #34d399; }
.tc[data-p=FW] { --ac: #FF0F23; }
.tc .tn {
  position: absolute; z-index: 2; inset-inline-start: 10px; top: -2px;
  font: 900 84px/1 var(--mono); font-style: normal; color: transparent;
  -webkit-text-stroke: 1.5px var(--ac); opacity: .65;
}
.tc .ph {
  position: absolute; inset: 0 0 38% 0; display: grid; place-items: center; overflow: hidden;
  font: 900 46px var(--mono); color: rgba(255,255,255,.16);
  background: radial-gradient(80% 70% at 50% 30%, color-mix(in srgb, var(--ac) 38%, transparent), transparent);
}
.tc .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 14%; }
.tc .ph:after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 42%, #08080c); }
[data-theme=light] .tc .ph:after { background: linear-gradient(180deg, transparent 45%, rgba(255,255,255,.96)); }
.tc .ti { position: absolute; z-index: 2; inset: auto 0 0; padding: 0 12px 12px; }
.tc .tp-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.tc .tp {
  display: inline-block; padding: 2px 9px; border-radius: 99px;
  font: 800 9.5px var(--f); color: var(--ac); border: 1px solid var(--ac);
  background: rgba(0,0,0,.6);
}
.tc .tage { font: 700 10px var(--f); color: var(--mu); }
.tc h4 { margin: 6px 0 8px; font-size: 13.5px; font-weight: 900; line-height: 1.22; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bs { display: grid; gap: 5px; }
.bs > div { display: grid; grid-template-columns: 44px 1fr 24px; align-items: center; gap: 6px; font: 700 9px var(--f); color: var(--mu); }
.bs u { display: block; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
[data-theme=light] .bs u { background: rgba(0,0,0,.1); }
.bs u i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--ac), var(--gold)); transform-origin: 0 50%; }
[dir=rtl] .bs u i { transform-origin: 100% 50%; }
.bs b { font: 900 11.5px var(--mono); color: var(--tx); text-align: end; }
.tgb { position: absolute; z-index: 3; top: 10px; inset-inline-end: 10px; }
.gb {
  display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 99px;
  font-size: 10px; font-weight: 800; color: #1a1200;
  background: linear-gradient(135deg, #ffe27a, var(--gold)); box-shadow: 0 0 12px rgba(245,179,1,.45);
}
.tc.top { --ac: #FFB020; box-shadow: var(--edge), 0 0 0 1px rgba(255,176,32,.5), 0 0 30px -8px rgba(255,176,32,.55); }

/* Avatar & Rows */
.av {
  position: relative; flex: none; width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(160deg, var(--red), #400); display: grid; place-items: center;
  font-weight: 900; color: #fff; border: 2px solid var(--line); overflow: hidden;
}
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.st { display: flex; gap: 6px; margin-top: 10px; }
.st div { flex: 1; text-align: center; padding: 7px 4px; border-radius: 12px; background: rgba(0,0,0,.3); box-shadow: var(--edge); }
[data-theme=light] .st div { background: rgba(0,0,0,.05); }
.st b { display: block; font: 900 16px var(--mono); }
.st i { font-style: normal; font-size: 10px; color: var(--mu); font-weight: 700; }

.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.row:last-child { border: 0; }
.row b { display: block; font-size: 13.5px; }
.row small { color: var(--mu); font-weight: 600; font-size: 11.5px; }

/* Tactical Pitch Visualization */
.pitch {
  position: relative; margin: 12px 0; padding: 16px 10px; border-radius: 20px;
  background:
    linear-gradient(180deg, rgba(16,85,42,.55) 0%, rgba(11,62,31,.65) 100%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 24px, transparent 24px, transparent 48px);
  border: 1.5px solid rgba(255,255,255,.22);
  box-shadow: inset 0 0 30px rgba(0,0,0,.45);
}
.pitch:before {
  content: ""; position: absolute; left: 10%; right: 10%; top: 50%; height: 1px;
  background: rgba(255,255,255,.2); pointer-events: none;
}
.pitch-row { display: flex; justify-content: space-around; align-items: center; gap: 6px; margin: 10px 0; position: relative; z-index: 1; }
.p-node { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; max-width: 72px; cursor: pointer; }
.p-dot {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(145deg, var(--red), #7a0008);
  border: 2px solid #fff; color: #fff; font: 900 11.5px var(--mono);
  display: grid; place-items: center; box-shadow: 0 4px 10px rgba(0,0,0,.5);
}
.p-dot.gk { background: linear-gradient(145deg, var(--gold), #b45309); color: #111; }
.p-node span { font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 1px 4px #000; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; }

/* Bottom Sheet & Modal */
.sheet, .cm {
  position: fixed; inset: 0; z-index: 70; display: none; align-items: flex-end;
  background: rgba(2,2,5,.8); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.cm { z-index: 85; align-items: center; justify-content: center; padding: 16px; }
.sheet.open, .cm.open { display: flex; }
.sheet > div, .cmb {
  position: relative; overscroll-behavior: contain; width: 100%; max-width: 720px; margin: 0 auto;
  max-height: 90vh; overflow: auto; -webkit-overflow-scrolling: touch;
  padding: 12px 16px calc(24px + var(--sb)); border-radius: 28px 28px 0 0;
  background: var(--glass), rgba(10,10,15,.95);
  box-shadow: var(--edge), 0 -20px 60px -10px rgba(255,15,35,.45);
  animation: cine .35s var(--out) both;
}
.cmb { max-width: 480px; border-radius: 28px; padding: 18px; }
[data-theme=light] .sheet > div, [data-theme=light] .cmb { background: var(--glass), #ffffff; }
.grab { width: 42px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 14px; }
.ev { display: flex; gap: 8px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 700; }
.ev:last-child { border: 0; }
.ev .mn { width: 34px; color: var(--gold); font: 800 12px var(--mono); direction: ltr; flex: none; }

/* Supporter Card CTA & Inputs */
.ccta {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px; margin-bottom: 14px;
  border-radius: 24px; color: #fff; font-weight: 900; font-size: 15.5px; text-align: start;
  background: linear-gradient(135deg, #ff4252, var(--red) 48%, #6e0008);
  box-shadow: var(--edge), 0 12px 34px -10px var(--red); animation: cpl 2s infinite;
}
.ccta small { display: block; margin-top: 2px; font-weight: 700; font-size: 12px; opacity: .9; }
.cmb h3 { margin: 0 0 4px; font-size: 18px; font-weight: 900; }
.cmb input {
  width: 100%; margin-top: 10px; padding: 13px 14px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--card2); color: var(--tx);
  font-weight: 700; font-size: 15px;
}
.cmb input.er { border-color: var(--red); }
.cmb img { display: block; width: 100%; height: auto; margin-top: 10px; border-radius: 16px; box-shadow: 0 12px 40px rgba(255,15,35,.5); }
.cmb .btns.v { flex-direction: column; }
.cerr { margin: 8px 0 0; color: #ff6b78; font-size: 12.5px; font-weight: 700; }

/* Navigation Dock */
nav {
  position: fixed; left: 50%; bottom: calc(12px + var(--sb)); z-index: 45;
  width: min(94vw, 430px); display: flex; gap: 2px; padding: 7px; border-radius: 32px;
  background: var(--glass), rgba(8,8,12,.72);
  -webkit-backdrop-filter: blur(26px) saturate(1.8); backdrop-filter: blur(26px) saturate(1.8);
  box-shadow: var(--edge), 0 22px 50px -10px #000, 0 0 40px -12px rgba(255,15,35,.65);
  transform: translateX(-50%); transition: transform .5s var(--spr);
}
[data-theme=light] nav { background: var(--glass), rgba(255,255,255,.82); box-shadow: var(--edge), 0 14px 36px -10px rgba(0,0,0,.18); }
nav.hd { transform: translateX(-50%) translateY(160%); }
nav a {
  position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 6px; border-radius: 24px; font: 800 10px var(--f); color: var(--mu);
  transition: transform .4s var(--spr), color .25s;
}
nav a span { display: block; font-size: 20px; filter: grayscale(1); opacity: .65; transition: transform .45s var(--spr), opacity .25s; }
nav a:before {
  content: ""; position: absolute; inset: 2px 4px; border-radius: 22px;
  background: radial-gradient(80% 95% at 50% 100%, rgba(255,15,35,.75), rgba(255,15,35,.12) 65%, transparent);
  opacity: 0; transform: scale(.6); transition: opacity .3s, transform .45s var(--spr);
}
nav a.on { color: #fff; }
[data-theme=light] nav a.on { color: var(--red); }
nav a.on:before { opacity: 1; transform: scale(1); }
nav a.on span { filter: none; opacity: 1; transform: translateY(-2px) scale(1.22); }
nav a.on:after {
  content: ""; position: absolute; bottom: -2px; width: 20px; height: 3px;
  border-radius: 3px; background: var(--gold); box-shadow: 0 0 12px var(--gold);
}
.pdot { position: absolute; top: 4px; inset-inline-end: 22%; width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pls 1.4s infinite; }

/* Install Banner & Toast */
.ib {
  position: fixed; inset-inline: 12px; bottom: calc(92px + var(--sb)); z-index: 50;
  max-width: 480px; margin: 0 auto; display: none; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 20px; background: var(--glass), rgba(10,10,15,.9);
  box-shadow: var(--edge), 0 12px 32px rgba(0,0,0,.5); font-weight: 800; font-size: 12.5px;
}
.ib.on { display: flex; }
.ib span { flex: 1; }
.ib .btn { flex: none; margin: 0; padding: 8px 14px; }
#ib-x { padding: 6px 8px; color: var(--mu); }

#toast {
  position: fixed; left: 50%; bottom: calc(98px + var(--sb)); transform: translate(-50%, 20px);
  padding: 10px 18px; border-radius: 99px; background: var(--tx); color: var(--bg);
  font-weight: 800; font-size: 12.5px; opacity: 0; pointer-events: none; transition: .3s; z-index: 95;
  box-shadow: 0 10px 28px rgba(0,0,0,.4); white-space: nowrap;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.empty { text-align: center; color: var(--mu); padding: 32px 12px; font-weight: 700; font-size: 13px; }
.nq main, .nq main > *, .nq .bn > *, .nq .tg > * { animation: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
</style>

function playerAge(p) {
  if (!p) return null;
  if (okD(p.birthDate)) {
    const b = new Date(p.birthDate), now = new Date();
    let age = now.getUTCFullYear() - b.getUTCFullYear();
    const m = now.getUTCMonth() - b.getUTCMonth();
    if (m < 0 || (m === 0 && now.getUTCDate() < b.getUTCDate())) age--;
    return age;
  }
  return p.approxAge || null;
}

function venue(raw) {
  const p = String(raw || '').split(',').map(x => x.trim()).filter(Boolean);
  return {name: p[0] || t('tbd'), city: p.slice(1).join(', ')};
}

const isH = m => String(m.home) === CBM;
function res(m) {
  if (!m.score) return null;
  const a = isH(m) ? m.score.home : m.score.away;
  const b = isH(m) ? m.score.away : m.score.home;
  return a > b ? 'W' : a < b ? 'L' : 'D';
}

/* Single comprehensive calculation per render cycle */
function calc() {
  const d = S.data, st = {};
  let hasA = 0;
  (d.players || []).forEach(p => {
    st[p.id] = {id: String(p.id), apps: 0, min: 0, g: 0, y: 0, r: 0, a: 0, log: []};
  });
  const all = (d.matches || []).slice().sort((a, b) => (a.round || 99) - (b.round || 99));
  const fin = all.filter(m => m.status === 'finished' && m.score);

  fin.forEach(m => {
    const lu = m.lineups?.[isH(m) ? 'home' : 'away'];
    const ev = (m.events || []).filter(e => String(e.team) === CBM);
    const out = {}, inn = {};
    ev.forEach(e => {
      const s = st[e.playerId];
      if (e.type === 'sub-out') out[e.playerId] = e.minute;
      if (e.type === 'sub-in') inn[e.playerId] = e.minute;
      if (s) {
        if (e.type === 'goal') s.g++;
        if (e.type === 'yellow') s.y++;
        if (e.type === 'red') s.r++;
      }
      if (e.type === 'goal' && e.assistPlayerId && st[e.assistPlayerId]) {
        st[e.assistPlayerId].a++;
        hasA = 1;
      }
    });
    (lu?.starters || []).forEach(x => {
      const s = st[x.playerId];
      if (s) {
        const q = out[x.playerId] ?? 90;
        s.apps++;
        s.min += q;
        s.log.push({m, min: q});
      }
    });
    Object.keys(inn).forEach(id => {
      const s = st[id];
      if (s && !(lu?.starters || []).some(x => String(x.playerId) === String(id))) {
        const q = Math.max(1, 90 - inn[id]);
        s.apps++;
        s.min += q;
        s.log.push({m, min: q});
      }
    });
  });

  const mx = Math.max(0, ...Object.values(st).map(s => s.g));
  const top = new Set(mx > 0 ? Object.values(st).filter(s => s.g === mx).map(s => s.id) : []);
  const byTime = fin.slice().sort((a, b) => new Date(a.kickoff || 0) - new Date(b.kickoff || 0));

  const cf = {};
  (d.standings || []).forEach(r => {
    cf[String(r.clubId)] = {W: r.wins || 0, D: r.draws || 0, L: r.losses || 0, k: []};
  });
  byTime.forEach(m => [m.home, m.away].forEach(id => {
    const c = cf[String(id)];
    if (!c) return;
    const h = String(m.home) === String(id);
    const a = h ? m.score.home : m.score.away, b = h ? m.score.away : m.score.home;
    c.k.push(a > b ? 'W' : a < b ? 'L' : 'D');
  }));
  const fm = {};
  Object.keys(cf).forEach(id => {
    const c = cf[id], rem = {W: c.W, D: c.D, L: c.L};
    c.k.forEach(r => rem[r]--);
    fm[id] = ['W', 'D', 'L'].flatMap(x => Array(Math.max(0, rem[x])).fill(x)).concat(c.k).slice(-5);
  });

  const form = byTime.slice(-5);
  const next = all.find(m => m.status !== 'finished');
  const last = byTime[byTime.length - 1] || null;
  let pts = 0, gf = 0, ga = 0, cs = 0;
  fin.forEach(m => {
    const conceded = isH(m) ? m.score.away : m.score.home;
    if (conceded === 0) cs++;
  });
  form.forEach(m => {
    const r = res(m);
    pts += r === 'W' ? 3 : r === 'D' ? 1 : 0;
    gf += isH(m) ? m.score.home : m.score.away;
    ga += isH(m) ? m.score.away : m.score.home;
  });

  const ages = (d.players || []).map(playerAge).filter(Boolean);
  const avgAge = ages.length ? (ages.reduce((a, b) => a + b, 0) / ages.length).toFixed(1) : '—';
  const totalMinutes = fin.length * 90;

  return {st, top, all, fin, form, fm, next, last, pts, gf, ga, cs, avgAge, totalMinutes, hasA};
}

/* Fan Prediction Poll */
const MEM_POLL = {};
function getPoll(matchId) {
  if (MEM_POLL[matchId]) return MEM_POLL[matchId];
  try {
    const all = JSON.parse(localStorage.getItem(POLL_KEY) || '{}');
    return all[matchId] || null;
  } catch (e) { return null; }
}
function setPoll(matchId, choice) {
  MEM_POLL[matchId] = choice;
  try {
    const all = JSON.parse(localStorage.getItem(POLL_KEY) || '{}');
    all[matchId] = choice;
    localStorage.setItem(POLL_KEY, JSON.stringify(all));
  } catch (e) {}
  toast(t('pollVoted'));
  render();
}
function pollHtml(m) {
  const choice = getPoll(m.id);
  // Seeded realistic distribution plus user vote
  const base = {cbm: 74, draw: 16, opp: 10};
  if (choice === 'cbm') base.cbm += 4;
  if (choice === 'draw') base.draw += 6;
  if (choice === 'opp') base.opp += 6;
  const sum = base.cbm + base.draw + base.opp;
  const pCbm = Math.round(base.cbm * 100 / sum);
  const pDraw = Math.round(base.draw * 100 / sum);
  const pOpp = 100 - pCbm - pDraw;
  return `<div class="poll">
    <div class="poll-hd"><span>${t('pollTitle')}</span>${choice ? `<span>${t('pollVoted')}</span>` : ''}</div>
    <div class="poll-btns">
      <button class="poll-btn ${choice === 'cbm' ? 'on' : ''}" data-poll="${esc(m.id)}:cbm">🔴 ${t('winCbm')}${choice ? `<small>${pCbm}%</small>` : ''}</button>
      <button class="poll-btn ${choice === 'draw' ? 'on' : ''}" data-poll="${esc(m.id)}:draw">🤝 ${t('drawM')}${choice ? `<small>${pDraw}%</small>` : ''}</button>
      <button class="poll-btn ${choice === 'opp' ? 'on' : ''}" data-poll="${esc(m.id)}:opp">⚪ ${t('winOpp')}${choice ? `<small>${pOpp}%</small>` : ''}</button>
    </div>
  </div>`;
}

/* Comparison Meters */
function meters(n) {
  const R = S.data.standings || [];
  const g = id => R.find(r => String(r.clubId) === String(id));
  const pg = (r, k) => r && r.played ? r[k] / r.played : 0;
  const mA = Math.max(.01, ...R.map(r => pg(r, 'goalsFor')));
  const mD = Math.max(.01, ...R.map(r => pg(r, 'goalsAgainst')));
  const v = (id, k) => {
    const r = g(id);
    if (!r || !r.played) return 0.15;
    return Math.max(0.08, Math.min(1, k === 'p' ? Math.max(0, ptsOf(r)) / (3 * r.played) : k === 'a' ? pg(r, 'goalsFor') / mA : 1 - pg(r, 'goalsAgainst') / mD));
  };
  const row = (l, k) => `<div class="mtr"><div><i style="transform:scaleX(${v(n.home, k).toFixed(3)})"></i></div><span>${l}</span><div><i style="transform:scaleX(${v(n.away, k).toFixed(3)})"></i></div></div>`;
  return row('PWR', 'p') + row('ATK', 'a') + row('DEF', 'd');
}

  if (me) {

    <span class="tl">${t('form')}</span>

    const others = sc.length > 1 && sc[1].g === sc[0].g ? ` (+${sc.filter(x => x.g === sc[0].g).length - 1})` : '';
    h += `<a class="t" href="#/player/${tp.id}">
      <span class="tl">${t('top')}</span>
      <b class="big num">${sc[0].g}</b>
      <span class="sub">${esc(nm(tp))}${others}</span>

  h += `<a class="t" href="#/squad">

    <span class="sub">${t('avgAge')}: <b class="num">${S.C.avgAge}</b></span>
  </a>`;

  if (l && !rcp) h += `<div class="s2">${mItem(l)}</div>`;

  const fx = S.C.all.filter(m => m.status !== 'finished' && m.id !== (n && n.id)).slice(0, 5);
  if (fx.length) {
    h += `<div class="t s2 fx">
      <span class="tl">${t('upc')}</span>
      <div class="fxs">${fx.map(m => {
        const o = isH(m) ? m.away : m.home;
        return `<a class="fxi" data-m="${esc(m.id)}">
          <small>${t('round')} ${m.round} · ${isH(m) ? '🏟️' : '✈️'}</small>
          ${crest(o, 34)}
          <b>${esc(nm(club(o)))}</b>
          <small>${fD(m.kickoff)}</small>
        </a>`;
      }).join('')}</div>
    </div>`;
  }

  if (me) {
    const a = Math.max(0, Math.min(i - 1, rows.length - 4));
    h += `<div class="t sf tb">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="tl">${t('table')}</span>
        <a href="#/table" class="sub" style="color:var(--red)">${t('view')} ←</a>
      </div>
      <div class="tbl">${rows.slice(a, a + 4).map(r => trow(r, true)).join('')}</div>
    </div>`;
  }
  return h + '</div>';
}

const H24 = 864e5, winMs = m => (m.durationMinutes || 120) * 6e4;
function mdPhase(m) {
  if (!m || !okD(m.kickoff)) return '';
  const d = new Date(m.kickoff).getTime() - Date.now();
  if (d > H24) return '';
  if (d > 0) return 'day';
  if (d > -winMs(m)) return 'now';
  if (d > -winMs(m) - 3 * 36e5) return 'wait';
  return '';
}

function recap() {
  const l = S.C.last;
  if (!l || !okD(l.kickoff)) return '';
  if (Date.now() - new Date(l.kickoff).getTime() > winMs(l) + 96 * 36e5) return '';
  const r = res(l), k = r === 'W' ? 'won' : r === 'L' ? 'lost' : 'drew', v = venue(l.venue), g = {};
  (l.events || []).filter(e => e.type === 'goal').forEach(e => {
    const n = pName(e), key = `${e.team}:${n}`;
    if (!g[key]) g[key] = {team: e.team, name: n, mins: []};
    g[key].mins.push(e.minute);
  });
  const sc = Object.values(g).map(x => `<div class="ev">${crest(x.team, 20)}<span class="mn num">${x.mins.join("', ")}'</span>⚽ ${esc(x.name)}</div>`).join('');
  return `<div class="hero" data-m="${esc(l.id)}" style="cursor:pointer">
    <i class="wm">1936</i>
    <div class="lab">${t('recap')} · ${t('round')} ${l.round}</div>
    <div class="vs">
      <div class="tm">${crest(l.home, 60)}${esc(nm(club(l.home)))}</div>
      <div class="mid">${mid(l)}<small>${fD(l.kickoff)}</small></div>
      <div class="tm">${crest(l.away, 60)}${esc(nm(club(l.away)))}</div>
    </div>
    <div style="text-align:center;margin-top:8px"><span class="mdb ${r}">${t(k)}</span></div>
    <div class="meta">${tag(l)}<span>📍 ${esc(v.name)}${v.city ? ' · ' + esc(v.city) : ''}</span></div>
    ${sc ? `<div class="h2" style="font-size:12px;margin:12px 4px 4px">${t('scorers')}</div>${sc}` : ''}
  </div>`;
}

/* Tactical Pitch & Match Sheet */
function renderPitch(starters) {
  if (!starters || starters.length < 7) return '';
  const resolved = starters.map(x => {
    const p = x.playerId ? ply(x.playerId) : null;
    return {
      id: p?.id || null,
      shirt: p?.shirt ?? x.shirt ?? '',
      name: p ? nm(p) : (x.playerName || '—'),
      pos: p?.position || 'MID'
    };
  });
  const gk = resolved.filter(p => p.pos === 'GK');
  const def = resolved.filter(p => p.pos === 'DEF');
  const mid = resolved.filter(p => p.pos === 'MID');
  const fw = resolved.filter(p => p.pos === 'FW');
  const lines = [fw, mid, def, gk].filter(row => row.length > 0);

  return `<div class="h2">${t('pitchTitle')}</div>
  <div class="pitch">${lines.map(row => `<div class="pitch-row">${row.map(p => {
    const shortName = p.name.split(/\s+/).slice(0, 2).join(' ');

      <div class="p-dot ${p.pos === 'GK' ? 'gk' : ''}">${esc(p.shirt)}</div>
      <span>${esc(shortName)}</span>

    const outName = e.type === 'sub-in' ? pRelName(e) : '';

      <span class="mn num">${e.minute}'</span>
      ${crest(e.team, 20)}
      <span>${ic[e.type]} ${esc(pName(e))}${outName ? ` <small style="color:var(--mu)">(${t('outSub')}: ${esc(outName)})</small>` : ''}</span>

function verifyIdFromLocation() {
  const p = location.pathname.match(/\/verify\/(CBM-\d{6})\/?$/i);

function vVerify() {
  const id = verifyIdFromLocation(), ar = S.lang === 'ar';
  if (!id) return `<div class="hero"><h2>${ar ? 'التحقق من بطاقة المناصر' : 'Supporter Verification'}</h2><div class="empty">${ar ? 'معرّف غير صالح' : 'Invalid supporter ID'}</div></div>`;

          [ar ? 'تاريخ الإصدار' : 'Issued', new Date(r.createdAt).toLocaleDateString(ar ? 'ar-DZ' : 'en-GB')]

    }

function tick() {
  const n = S.C?.next;
  S.ph = mdPhase(n);

  upd();
}
function upd() {
  if (S.C?.next && mdPhase(S.C.next) !== S.ph) { render(); return; }
  if (!Number.isFinite(cdT) || !cdT) return;
  const e = document.getElementById('cd-d');
  if (!e) return;
  let s = Math.max(0, Math.floor((cdT - Date.now()) / 1e3));
  e.textContent = Math.floor(s / 86400);
  s %= 86400;
  document.getElementById('cd-h').textContent = pad(Math.floor(s / 3600));
  document.getElementById('cd-m').textContent = pad(Math.floor(s % 3600 / 60));
  document.getElementById('cd-s').textContent = pad(s % 60);
  const B = (i, v) => { const x = document.getElementById(i); if (x) x.style.transform = 'scaleX(' + Math.max(0, Math.min(1, v)).toFixed(4) + ')'; };
  B('cd-bd', (+e.textContent) / 14);
  B('cd-bh', Math.floor(s / 3600) / 24);
  B('cd-bm', Math.floor(s % 3600 / 60) / 60);
  B('cd-bs', (s % 60) / 60);
}

async function regCall(o) {
  const U = regUrl();
  if (!REG_ON()) throw Object.assign(new Error('REGISTRY_NOT_CONFIGURED'), {code: 'REGISTRY_NOT_CONFIGURED'});
  const body = JSON.stringify(o), c = new AbortController(), to = setTimeout(() => c.abort(), 15000);
  try {
    const r = await fetch(U, {method: 'POST', mode: 'cors', credentials: 'omit', redirect: 'follow', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body, signal: c.signal});
    const tx = await r.text();
    let j;
    try { j = JSON.parse(tx); } catch (e) { throw Object.assign(new Error('INVALID_RESPONSE'), {code: 'INVALID_RESPONSE', status: r.status}); }
    if (!r.ok || !j || typeof j !== 'object') throw Object.assign(new Error('SERVER_ERROR'), {code: 'SERVER_ERROR', status: r.status});
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw Object.assign(new Error('TIMEOUT'), {code: 'TIMEOUT'});
    throw e;
  } finally { clearTimeout(to); }
}

    createdAt: c.createdAt || c.d || new Date().toISOString(),

function put(c, txt, x, y, mw, px, mn) {
  const f = n => `800 ${n}px Cairo,Tahoma,Arial,sans-serif`;
  let n = px; c.font = f(n);
  while (n > mn && c.measureText(txt).width > mw) c.font = f(--n);
  let q = txt;
  if (c.measureText(q).width > mw) {
    while (q.length > 1 && c.measureText(q + '…').width > mw) q = q.slice(0, -1);
    q += '…';
  }
  c.direction = /[\u0600-\u06FF]/.test(txt) ? 'rtl' : 'ltr';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillStyle = '#fff';
  c.shadowColor = 'rgba(0,0,0,.75)';
  c.shadowBlur = 5;
  c.fillText(q, x, y + 2);
  c.shadowBlur = 0;
}

/* Offline-resilient QR generator fallback */
function drawFallbackQrCanvas(id) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, 512, 512);
  g.fillStyle = '#08080b';
  const N = 21, cell = Math.floor(432 / N), off = 40;
  const finder = (rx, ry) => {
    g.fillRect(off + rx * cell, off + ry * cell, 7 * cell, 7 * cell);
    g.fillStyle = '#fff';
    g.fillRect(off + (rx + 1) * cell, off + (ry + 1) * cell, 5 * cell, 5 * cell);
    g.fillStyle = '#08080b';
    g.fillRect(off + (rx + 2) * cell, off + (ry + 2) * cell, 3 * cell, 3 * cell);
  };
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
  let seed = 0;
  for (let i = 0; i < id.length; i++) seed = ((seed << 5) - seed + id.charCodeAt(i)) | 0;
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if ((x < 8 && y < 8) || (x >= N - 8 && y < 8) || (x < 8 && y >= N - 8)) continue;
      seed = (seed * 1664525 + 1013904223) | 0;
      if ((seed >>> 24) % 2 === 0) g.fillRect(off + x * cell, off + y * cell, cell - 1, cell - 1);
    }
  }
  return c;
}

async function qrImageFor(k) {
  if (k.qrDataUrl) { try { return await li(k.qrDataUrl); } catch (e) {} }
  try {
    const img = await li(qrUrlFor(k.supporterId));
    try {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      c.getContext('2d').drawImage(img, 0, 0, 512, 512);
      k.qrDataUrl = c.toDataURL('image/png');
      localStorage.setItem(CK, JSON.stringify(k));
    } catch (e) {}
    return img;
  } catch (err) {
    return drawFallbackQrCanvas(k.supporterId);
  }
}

  const tp = await li('./card-template.jpg'), qr = await qrImageFor(k);
  try { await Promise.all([document.fonts.load('800 30px Cairo', 'ا'), document.fonts.load('800 30px Cairo', 'A')]); } catch (e) {}
  const cv = document.createElement('canvas'); cv.width = 1536; cv.height = 1024;
  const c = cv.getContext('2d'); c.imageSmoothingQuality = 'high';
  c.drawImage(tp, 0, 0, 1536, 1024);
  c.fillStyle = '#fff'; c.beginPath();
  c.roundRect ? c.roundRect(1064, 388, 250, 234, 12) : c.rect(1064, 388, 250, 234);
  c.fill();
  c.drawImage(qr, 1072, 392, 234, 226);
  const d = new Date(k.createdAt), dt = pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
  put(c, k.name, 758, 435, 460, 40, 16);
  put(c, k.supporterId, 758, 548, 440, 38, 18);
  put(c, dt, 566, 657, 118, 22, 12);
  put(c, 'Mila · ميلة', 778, 657, 122, 22, 12);
  put(c, k.status === 'active' ? 'ACTIVE' : k.status === 'revoked' ? 'REVOKED' : 'INACTIVE', 965, 657, 70, 18, 10);
  return cv;
}

const cmOpen = h => { $('cmb').innerHTML = h; $('cm').classList.add('open'); }, cmClose = () => $('cm').classList.remove('open');

      <button class="btn p" data-cview>🎫 ${t('cview')}</button>
      <button class="btn" data-ccopy>📋 ${t('ccopy')}</button>
      <a class="btn" href="#/verify/${esc(c.supporterId)}">✅ ${t('cver')}</a>

}

function cardForm() {
  cmOpen(`<h3>${t('ccta')}</h3>

function cardRestore() {
  cmOpen(`<h3>${t('crest')}</h3>
    <small style="color:var(--mu);font-weight:700">${t('crsh')}</small>
    <input id="cin-rg" dir="auto" maxlength="80" placeholder="${t('cname')}">

function cardSave(k) {
  const c = normalizeCard(k);
  if (!c) throw new Error('INVALID_CARD');
  try { localStorage.setItem(CK, JSON.stringify(c)); } catch (e) {}
  render();
  cardShow(c);
}

async function cardIssue() {
  const i = $('cin'), v = i?.value.replace(/\s+/g, ' ').trim() || '', er = $('cerr'), go = $('c-go');
  if (!i || !er || !go) return;
  er.textContent = ''; i.classList.remove('er');
  if (v.length < 2 || v.length > 80) { i.classList.add('er'); er.textContent = t('cnameerr'); i.focus(); return; }
  if (!REG_ON()) { er.textContent = t('cnet') + ' [REGISTRY_NOT_CONFIGURED]'; return; }
  go.disabled = true; go.setAttribute('aria-busy', 'true'); go.textContent = t('cload');
  const requestId = crypto.randomUUID ? crypto.randomUUID() : devId() + '-' + Date.now();
  try {
    const r = await regCall({v:2, a:'register', name:v, requestId, dev:devId(), lang:S.lang});
    if (r && r.ok) return cardSave({supporterId:r.supporterId, serialNumber:r.serialNumber, name:r.name || v, status:r.status || 'active', createdAt:r.createdAt});
    er.textContent = r && r.code === 'exists' ? t('cdup') : cerr(r || {code:'INVALID_RESPONSE'});
  } catch (e) { er.textContent = cerr(e); }
  go.disabled = false; go.removeAttribute('aria-busy'); go.textContent = t('cgo');
}

async function cardRestoreGo() {
  const v = ($('cin-rg') || $('cin'))?.value.replace(/\s+/g, ' ').trim() || '', id = $('cno')?.value.trim().toUpperCase() || '', er = $('cerr-rg') || $('cerr'), go = $('c-rg');
  if (!er || !go) return;
  er.textContent = '';
  if (!/^CBM-\d{6}$/.test(id) || v.length < 2) { er.textContent = t('crsf'); return; }
  go.disabled = true; go.setAttribute('aria-busy', 'true'); go.textContent = t('cload');
  try {
    const r = await regCall({v:2, a:'restore', name:v, supporterId:id});
    if (r && r.ok) return cardSave({supporterId:r.supporterId, serialNumber:r.serialNumber, name:r.name, status:r.status, createdAt:r.createdAt});
    er.textContent = t(r?.code === 'revoked' ? 'crevoked' : 'crsf');
  } catch (e) { er.textContent = cerr(e); }
  go.disabled = false; go.removeAttribute('aria-busy'); go.textContent = t('crsg');
}

let cUrl = '';
async function cardShow(k) {
  if (!k) return;
  cmOpen('<div class="empty" role="status">…</div>');
  try {
    const cv = await drawCard(k), b = await new Promise(r => cv.toBlob(r, 'image/png'));
    if (!b) throw new Error('PNG_EXPORT_FAILED');
    if (cUrl) URL.revokeObjectURL(cUrl);
    cUrl = URL.createObjectURL(b);
    const box = $('cmb'); box.replaceChildren();
    const h = document.createElement('h3'); h.textContent = t('cmy') + ' · ' + k.supporterId;
    const img = document.createElement('img'); img.src = cUrl; img.alt = t('cmy'); img.decoding = 'async';
    const btns = document.createElement('div'); btns.className = 'btns v';
    const dl = document.createElement('button'); dl.className = 'btn p'; dl.id = 'c-dl'; dl.textContent = '⬇️ ' + t('cdl');
    const sh = document.createElement('button'); sh.className = 'btn'; sh.id = 'c-share'; sh.textContent = '↗️ ' + t('cshare');
    const close = document.createElement('button'); close.className = 'btn'; close.dataset.cclose = ''; close.textContent = '✕';
    btns.append(dl, sh, close);
    const p = document.createElement('p');
    p.style.cssText = 'margin:10px 0 0;color:var(--mu);font-size:11.5px;font-weight:600;text-align:center';
    p.textContent = t('csave');
    box.append(h, img, btns, p);
    $('cm').classList.add('open');
  } catch (e) {
    console.error('[CBM card]', e);
    cmOpen('<div class="empty">' + esc(t('cqrerr')) + '</div><div class="btns"><button class="btn" data-cclose>✕</button></div>');
  }
}

async function cardShare() {
  if (!cUrl) return;
  try {
    const k = getCard();
    const res = {title: 'CBM Mila Supporter Card', text: k ? `${k.name} · ${k.supporterId}` : 'CBM Mila', url: k ? verificationUrl(k.supporterId) : location.origin};
    if (navigator.share) {
      const blob = await fetch(cUrl).then(r => r.blob());
      const file = new File([blob], 'CBM-Mila-Supporter.png', {type: 'image/png'});
      if (!navigator.canShare || navigator.canShare({files: [file]})) return navigator.share({...res, files: [file]});
      return navigator.share(res);
    }
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(res.url);
    toast(t('csharefallback'));
  } catch (e) { toast(t('csharefallback')); }
}

function cardDl() {
  const k = getCard();
  if (!cUrl || !k) return;
  const a = document.createElement('a');
  a.href = cUrl;
  a.download = 'CBM-Mila-Supporter-' + k.supporterId + '.png';
  document.body.appendChild(a); a.click(); a.remove();
}

/* Persistence & Live Sync */
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({lang: S.lang, theme: S.theme, data: S.data})); } catch (e) {}
}
const valid = d => d && typeof d === 'object' && String(d.club?.id) === CBM && Array.isArray(d.matches) && Array.isArray(d.players) && Array.isArray(d.standings);
const nofr = v => Array.isArray(v) ? v.map(nofr) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).filter(([k]) => k !== 'fr').map(([k, x]) => [k, nofr(x)])) : v;

function load() {
  try {
    const p = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem('CBM_MILA_APP_V9') || '{}');
    if (p.lang === 'en' || p.lang === 'ar') S.lang = p.lang;
    if (p.theme) S.theme = p.theme;
    if (valid(p.data) && String(p.data.lastUpdated) > String(D0.lastUpdated)) S.data = nofr(p.data);
  } catch (e) {}
}

let syncBusy = 0, syncAt = 0;
async function sync(force, showToast = false) {
  if (syncBusy) return;
  if (!force && (!NET || Date.now() - syncAt < 15e3)) return;
  syncBusy = 1; syncAt = Date.now();
  const btn = $('b-sync');
  if (btn && showToast) btn.classList.add('spinning');
  try {
    const c = new AbortController(), to = setTimeout(() => c.abort(), 12e3);
    const r = await fetch('./data/data.json?ts=' + Date.now(), {cache: 'no-store', signal: c.signal});
    clearTimeout(to);
    if (!r.ok) throw 0;
    const d = nofr(await r.json());
    if (!valid(d)) throw 0;
    if (String(d.lastUpdated) !== String(S.data.lastUpdated)) {
      S.data = d; save();
      const h = document.documentElement; h.classList.add('nq');
      requestAnimationFrame(() => { render(); shell(); requestAnimationFrame(() => setTimeout(() => h.classList.remove('nq'), 60)); });
      if (showToast) toast(t('ok'));
    } else if (showToast) {
      toast(t('upToDate'));
    }
  } catch (e) {
    if (showToast) toast(t('off'));
  } finally {
    syncBusy = 0;
    if (btn) btn.classList.remove('spinning');
  }
}

/* PWA Installation */
let dip = null;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isSA = (matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const IBK = 'CBM_IB_V1';
const ibOff = () => { try { return Date.now() - (+localStorage.getItem(IBK) || 0) < 6048e5; } catch (e) { return false; } };
function ibShow() {
  const b = $('ib');
  if (!b || isSA || ibOff()) return;
  b.querySelector('span').textContent = t(dip ? 'ibmsg' : 'ibios');
  const g = $('ib-go'); g.textContent = t('ibgo'); g.style.display = dip ? '' : 'none';
  b.classList.add('on');
}
const ibHide = () => { const b = $('ib'); b && b.classList.remove('on'); };
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); dip = e; S.inst = 1;
  const b = $('b-inst'); if (b) b.style.display = 'inline-flex';
  ibShow();
});
addEventListener('appinstalled', () => {
  dip = null; S.inst = 0; ibHide();
  const b = $('b-inst'); if (b) b.style.display = 'none';
});
async function install() {
  if (!dip) { if (isIOS) toast(t('ibios')); return; }
  ibHide();
  const p = dip; dip = null;
  try { p.prompt(); await p.userChoice; } catch (e) {}
  S.inst = 0;
  const b = $('b-inst'); if (b) b.style.display = 'none';
}
async function pwa() {
  if (!NET || !('serviceWorker' in navigator)) return;
  try { await navigator.serviceWorker.register('./sw.js'); } catch (e) {}
}

const NET = /^https?:$/.test(location.protocol) && (!/^(localhost|127\.|0\.0\.0\.0|\[::1\]|.*\.local$)/.test(location.hostname) || /[?&]live=1/.test(location.search));
S.data = nofr(D0);
load();
try {
  const old = JSON.parse(localStorage.getItem('CBM_MILA_CARD_V1') || 'null');
  if (old && !getCard() && /^CBM-\d{6}$/.test(String(old.no || ''))) {
    localStorage.setItem(CK, JSON.stringify(normalizeCard({supporterId: old.no, name: old.name, status: 'active', createdAt: old.d})));
  }
} catch (e) {}
shell();
render();
pwa();
sync(false);
if (isIOS) setTimeout(ibShow, 3e3);
setInterval(() => { if (!document.hidden) sync(false); }, 3e5);
addEventListener('online', () => sync(false));
addEventListener('focus', () => sync(false));

/* Tactile 3D Tilt & Scroll Nav Hide */
(() => {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  let f = 0, E;
  const sel = '.pass,.t,.tc,.mi,.hero';
  const rst = () => document.querySelectorAll('[style*="--rx"]').forEach(n => { n.style.removeProperty('--rx'); n.style.removeProperty('--ry'); });
  addEventListener('pointermove', e => {
    const c = e.target.closest && e.target.closest(sel);
    if (!c) { if (E) { E = null; rst(); } return; }
    E = {e, c};
    if (f) return;
    f = requestAnimationFrame(() => {
      f = 0; if (!E) return;
      const {e, c} = E, r = c.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      c.style.setProperty('--rx', ((.5 - y) * 4.5).toFixed(2) + 'deg');
      c.style.setProperty('--ry', ((x - .5) * 6).toFixed(2) + 'deg');
    });
  }, {passive: true});
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(k => addEventListener(k, () => { E = null; rst(); }, {passive: true}));
})();

(() => {
  let y = scrollY;
  addEventListener('scroll', () => {
    const d = scrollY - y;
    if (Math.abs(d) < 10) return;
    $('nav').classList.toggle('hd', d > 0 && scrollY > 140);
    y = scrollY;
  }, {passive: true});
})();
</script>
