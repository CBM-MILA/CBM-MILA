<style>
:root{--bg:#080808;--bg2:#111;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.075);--line:rgba(255,255,255,.08);--tx:#fff;--mu:rgba(255,255,255,.56);--red:#E30613;--red2:#B4000D;--glow:rgba(227,6,19,.35);--w:#22c55e;--d:#f5b301;--l:#E30613;--gold:#f5b301;--nav:rgba(14,14,14,.72);--f:'Cairo',system-ui,sans-serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
[data-theme=light]{--bg:#f4f4f6;--bg2:#fff;--card:rgba(255,255,255,.8);--card2:#fff;--line:rgba(0,0,0,.08);--tx:#0b0b0c;--mu:rgba(0,0,0,.55);--glow:rgba(227,6,19,.2);--nav:rgba(255,255,255,.8)}
html[lang=en]{--f:'Inter',system-ui,sans-serif}
[data-theme=light] .sc,[data-theme=light] .cd div,[data-theme=light] .st div{background:rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:var(--f);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;user-select:none;-webkit-user-select:none;padding-bottom:calc(86px + var(--sb));
background:radial-gradient(120% 50% at 50% -10%,var(--glow),transparent 60%),var(--bg);background-repeat:no-repeat}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
header{position:sticky;top:0;z-index:30;padding:calc(10px + var(--st)) 16px 10px;display:flex;align-items:center;gap:10px;background:var(--nav);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid var(--line)}
header img{width:34px;height:34px;border-radius:10px;object-fit:contain;background:#fff;padding:2px}
.brand{flex:1;line-height:1.1}.brand b{font-size:17px;font-weight:800;display:block}.brand small{font-size:11px;color:var(--mu);font-weight:600}

.pill{height:34px;min-width:44px;padding:0 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:13px;display:grid;place-items:center;transition:transform .15s}
.pill:active,.press:active{transform:scale(.97)}.pill.ic{width:34px;min-width:34px;padding:0;font-size:16px}
main{width:100%;max-width:720px;margin:0 auto;padding:16px 14px;padding-inline:14px;box-sizing:border-box;overflow-x:hidden;overflow-x:clip;animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.h2{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-weight:800;font-size:19px}.h2 small{font-size:12px;color:var(--red);font-weight:700}
.glass{background:var(--card);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.hero{position:relative;overflow:hidden;padding:20px 16px 16px;border-radius:28px;background:linear-gradient(145deg,#121212 0%,#1c0507 50%,#0d0d0d 100%);border:1px solid rgba(227,6,19,.45);box-shadow:0 16px 40px -10px rgba(227,6,19,.3);color:#fff}.hero .crest{box-shadow:0 0 0 2px rgba(227,6,19,.35)}.hero .lab,.hero .mid small,.hero .meta{color:rgba(255,255,255,.7)}.hero .cd div{background:rgba(0,0,0,.45);border:1px solid rgba(227,6,19,.3)}
.hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--red);filter:blur(90px);opacity:.25;top:-130px;inset-inline-end:-80px}
.lab{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;text-align:center;margin:14px 0}
.tm{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.crest.cbm{background:#fff var(--logo) center/82% no-repeat}.crest{border-radius:50%;object-fit:contain;background:#fff;display:grid;place-items:center;color:#000;font-weight:900;flex:none;overflow:hidden}
.mid{font-size:34px;font-weight:900;letter-spacing:-.02em}.mid small{display:block;font-size:11px;color:var(--mu);font-weight:700}
.cd{display:flex;justify-content:center;gap:8px;margin:6px 0 14px;direction:ltr}
.cd div{min-width:58px;padding:9px 0 6px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid var(--line);text-align:center}
.cd b{display:block;font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.cd i{font-style:normal;font-size:10px;color:var(--mu);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12.5px;color:var(--mu);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800}
.tag.h{background:rgba(227,6,19,.18);color:#ff5a63;border:1px solid rgba(227,6,19,.4)}.tag.a{background:var(--card2);color:var(--mu);border:1px solid var(--line)}
.btns{display:flex;gap:8px;margin-top:14px}.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 11px;border-radius:14px;font-weight:800;font-size:13px;text-align:center;background:var(--card2);border:1px solid var(--line);transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.p{background:linear-gradient(180deg,var(--red),var(--red2));border-color:transparent;color:#fff;box-shadow:0 8px 24px -8px var(--glow)}
.form{display:flex;gap:7px}.f{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;font-family:Inter,sans-serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px -6px currentColor}

const cmOpen=h=>{$('cmb').innerHTML=h;$('cm').classList.add('open')},cmClose=()=>$('cm').classList.remove('open');
function cardBox(){const c=getCard();return c?`<div class="glass" style="padding:14px;margin-bottom:14px"><div style="font-weight:900">🔴⚪ ${t('cmy')}</div><small style="color:var(--mu);font-weight:700">${esc(c.name)} · N° #${esc(c.no)}</small><div class="btns"><button class="btn p" data-cview>${t('cview')}</button></div></div>`:`<button class="ccta" data-cnew><span style="font-size:30px">🎫</span><span>${t('ccta')}<small>${t('cphd2')}</small></span></button>`}
function cardForm(){cmOpen(`<h3>${t('ccta')}</h3><small style="color:var(--mu);font-weight:700">${t('cphd')}</small><input id="cin" dir="auto" maxlength="40" autocomplete="name" placeholder="${t('cname')}"><div class="btns"><button class="btn p" id="c-go">${t('cgo')}</button><button class="btn" data-cclose>✕</button></div>`);setTimeout(()=>{const i=$('cin');i&&i.focus()},60)}
function cardIssue(){const i=$('cin'),v=i.value.replace(/\s+/g,' ').trim();if(v.length<2){i.classList.add('er');i.focus();return}
let r;try{r=crypto.getRandomValues(new Uint32Array(1))[0]}catch(e){r=Math.floor(Math.random()*4e9)}
const k={name:v,no:String(r%9999+1).padStart(4,'0'),d:new Date().toISOString()};try{localStorage.setItem(CK,JSON.stringify(k))}catch(e){}render();cardShow(k)}
let cUrl='';
async function cardShow(k){if(!k)return;cmOpen('<div class="empty">…</div>');
try{const cv=await drawCard(k),b=await new Promise(r=>cv.toBlob(r,'image/png'));if(cUrl)URL.revokeObjectURL(cUrl);cUrl=URL.createObjectURL(b);
cmOpen(`<h3>${t('cmy')} · N° #${esc(k.no)}</h3><img src="${cUrl}" alt=""><div class="btns v"><button class="btn p" id="c-dl">⬇️ ${t('cdl')}</button><button class="btn" data-cclose>✕</button></div><p style="margin:10px 0 0;color:var(--mu);font-size:11.5px;font-weight:600;text-align:center">${t('csave')}</p>`)}
catch(e){cmOpen('<div class="empty">⚠️</div><div class="btns"><button class="btn" data-cclose>✕</button></div>')}}
function cardDl(){const k=getCard();if(!cUrl||!k)return;const a=document.createElement('a');a.href=cUrl;a.download='CBM-Mila-Supporter-'+k.no+'.png';document.body.appendChild(a);a.click();a.remove()}
/* persistence, sync (embedded -> cache -> network) */
function save(){try{localStorage.setItem(KEY,JSON.stringify({lang:S.lang,theme:S.theme,data:S.data}))}catch(e){}}
const valid=d=>d&&typeof d==='object'&&String(d.club?.id)===CBM&&Array.isArray(d.matches)&&Array.isArray(d.players)&&Array.isArray(d.standings);
const nofr=v=>Array.isArray(v)?v.map(nofr):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).filter(([k])=>k!=='fr').map(([k,x])=>[k,nofr(x)])):v;
function load(){try{const p=JSON.parse(localStorage.getItem(KEY)||'{}');if(p.lang==='en'||p.lang==='ar')S.lang=p.lang;if(p.theme)S.theme=p.theme;
if(valid(p.data)&&String(p.data.lastUpdated)>String(D0.lastUpdated))S.data=nofr(p.data)}catch(e){}}
async function sync(manual){if(!NET)return;
try{const c=new AbortController(),to=setTimeout(()=>c.abort(),12e3),r=await fetch('./data/data.json?ts='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(to);if(!r.ok)throw 0;const d=nofr(await r.json());if(!valid(d))throw 0;
if(String(d.lastUpdated)!==String(S.data.lastUpdated)){S.data=d;save();render();shell()}if(manual)toast(t('ok'))}catch(e){}}
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;S.inst=1;const b=$('b-inst');if(b)b.style.display='block'});
async function install(){if(!dip)return;dip.prompt();try{await dip.userChoice}catch(e){}dip=null;S.inst=0;const b=$('b-inst');if(b)b.style.display='none'}
async function pwa(){if(!NET||!('serviceWorker' in navigator))return;try{await navigator.serviceWorker.register('./sw.js')}catch(e){}}
const NET=/^https?:$/.test(location.protocol)&&(!/^(localhost|127\.|0\.0\.0\.0|\[::1\]|.*\.local$)/.test(location.hostname)||/[?&]live=1/.test(location.search));
S.data=nofr(D0);load();shell();render();pwa();sync(false);setInterval(()=>sync(false),3e5);
addEventListener('online',()=>sync(false));
</script>
