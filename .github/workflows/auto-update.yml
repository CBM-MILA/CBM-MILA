name: Auto Update CBM Mila Data

on:
  schedule:
    # يعمل تلقائياً كل 6 ساعات يومياً
    - cron: '0 */6 * * *'
  # يتيح لك تشغيله يدوياً بضغطة زر للتجربة
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ملفات المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت مكتبات السحب
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: تشغيل سكريبت التحديث
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: حفظ وتحديث البيانات في المستودع
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "تحديث تلقائي لبيانات المباريات والترتيب" && git push)
