name: Auto Update CBM Mila Data

on:
  schedule:
    - cron: "5 * * * *"        # كل ساعة عند الدقيقة 5
  workflow_dispatch: {}         # يسمح بالتشغيل اليدوي من تبويب Actions

permissions:
  contents: write               # لحفظ data/data.json
  pages: write                  # لإعادة نشر الموقع بعد التحديث

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: python scraper.py

      - name: Commit and publish if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: | git config user.name "cbm-bot" git config user.email "cbm-bot@users.noreply.github.com" git add data/data.json if git diff --staged --quiet; then echo "No data changes." else git commit -m "chore: auto-update data" git push gh api --method POST "/repos/${{ github.repository }}/pages/builds" || true fi
