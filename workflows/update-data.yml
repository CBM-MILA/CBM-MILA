name: Update CBM Mila Data

on:
  schedule:
    # Off-peak: every 6 hours at minute 12 (00:12, 06:12, 12:12, 18:12 UTC)
    - cron: "12 */6 * * *"
    # Match days (Thu/Fri/Sat in Algeria, 12:00–20:59 UTC = 13:00–21:59 CET): every 20 minutes
    - cron: "5,25,45 12-20 * * 4,5,6"
    # Midweek postponed/rescheduled match window (Tue/Wed 13:00–18:59 UTC): every 30 minutes
    - cron: "10,40 13-18 * * 2,3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run scraper in --dry-run mode without committing changes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      accept_regression:
        description: "Allow a one-time decrease in played matches (--accept-regression) for official league corrections"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  actions: write

concurrency:
  group: cbm-mila-update-data
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Keep scheduled workflow active (prevent 60-day GitHub inactivity disable)
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "/repos/${GITHUB_REPOSITORY}/actions/workflows/update-data.yml/enable" || true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Restore HTTP conditional request cache (ETag / Last-Modified)
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: cbm-http-cache-
          restore-keys: |
            cbm-http-cache-

      - name: Record pre-scrape HTTP cache digest
        id: cache-pre
        run: |
          if [ -f .cache/http_cache.json ]; then
            sha256sum .cache/http_cache.json | awk '{print $1}' > /tmp/http_cache_before.sha256
          else
            echo "none" > /tmp/http_cache_before.sha256
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ACCEPT_REGRESSION: ${{ inputs.accept_regression || 'false' }}
        run: python scraper.py --verbose

      - name: Check if HTTP conditional cache changed
        id: cache-diff
        run: |
          BEFORE="$(cat /tmp/http_cache_before.sha256 2>/dev/null || echo 'none')"
          if [ -f .cache/http_cache.json ]; then
            AFTER="$(sha256sum .cache/http_cache.json | awk '{print $1}')"
          else
            AFTER="none"
          fi
          if [ "${AFTER}" != "none" ] && [ "${BEFORE}" != "${AFTER}" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save HTTP conditional request cache only when changed
        if: steps.cache-diff.outputs.changed == 'true' && inputs.dry_run != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: cbm-http-cache-${{ hashFiles('.cache/http_cache.json') }}

      - name: Validate data/data.json before committing
        run: |
          python -c "
          import os, scraper, sys
          d = scraper.load_data('data/data.json')
          accept_reg = os.getenv('ACCEPT_REGRESSION', '').lower() in ('1', 'true', 'yes')
          errs = scraper.validate_dataset(d, schema_path='data/schema.json', accept_regression=accept_reg)
          if errs:
              print('Schema/sanity validation failed:', errs)
              sys.exit(1)
          "
        env:
          ACCEPT_REGRESSION: ${{ inputs.accept_regression || 'false' }}

      - name: Commit and push substantive changes (with conflict-safe re-scrape retry)
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          ACCEPT_REGRESSION: ${{ inputs.accept_regression || 'false' }}
        run: |
          git config user.name "cbm-bot"
          git config user.email "cbm-bot@users.noreply.github.com"
          git add data/data.json
          if [ -f data/status.json ]; then
            git add data/status.json
          fi
          if git diff --staged --quiet; then
            echo "No substantive data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): auto-update match & standings data"
          PUSHED=0
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed successfully on attempt ${attempt}"
              PUSHED=1
              break
            fi
            echo "Push attempt ${attempt} rejected; attempting rebase..."
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Pushed after clean rebase on attempt ${attempt}"
                PUSHED=1
                break
              fi
            else
              echo "Rebase conflict on data/; resetting to origin/${GITHUB_REF_NAME} and re-running scraper..."
              git rebase --abort || true
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              python scraper.py --verbose
              git add data/data.json
              if [ -f data/status.json ]; then
                git add data/status.json
              fi
              if git diff --staged --quiet; then
                echo "Remote already has equivalent data changes."
                PUSHED=1
                break
              fi
              git commit -m "chore(data): auto-update match & standings data"
            fi
            sleep 4
          done
          if [ "${PUSHED}" -ne 1 ]; then
            echo "Failed to push after 3 attempts"
            exit 1
          fi

      - name: Alert on workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/notify_failure.py
